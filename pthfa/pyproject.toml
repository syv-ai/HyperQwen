[build-system]
# torch is pinned to the dev image's version (pth-dev:phase0) because the
# CUDA headers and nvcc compatibility come from it; the built .so itself only
# needs torch >= 2.11 at run time (stable ABI floor, ADR 0003).
requires = [
    "setuptools>=77.0.3,<81.0.0",
    "ninja",
    "torch == 2.13.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "pth-flash-attn"
version = "0.0.0"
description = "Paged int8_per_token_head flash attention for vLLM on sm_80/86/89"
authors = [{name = "noon-at-cgn"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
# Same range as vLLM 0.30.0, the integration target.
requires-python = ">=3.10,<3.15"
dependencies = ["torch>=2.11"]

[project.entry-points."vllm.general_plugins"]
# vLLM calls every `vllm.general_plugins` entry point in every process it
# starts (engine core and each worker) before selecting an attention backend;
# `register` only records the backend's class path under
# AttentionBackendEnum.CUSTOM (ADR 0021), it imports no CUDA code.
pth_flash_attn = "pth_flash_attn.plugin:register"

[project.optional-dependencies]
# Exact versions installed in pth-dev:phase0 (docker/dev.Dockerfile).
test = [
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
    "scipy==1.18.1",
]
lint = [
    "ruff==0.17.0",
    "mypy==2.4.0",
    "typos==1.51.1",
    "clang-format==23.1.3",
    "shellcheck-py==0.11.0.1",
    "pre-commit==4.6.2",
]

[tool.setuptools.packages.find]
where = ["python"]
include = ["pth_flash_attn*"]

# ---------------------------------------------------------------------------
# ruff: mirrors vLLM v0.30.0 (pyproject.toml [tool.ruff.lint]) plus two
# project additions, each justified where it appears: markdown excluded here,
# pydocstyle (D) in [tool.ruff.lint].
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py310"
# Markdown: ruff 0.17 formats Python code blocks inside .md files (observed:
# `ruff format --check` flagged docs/walkthrough). Docs quote upstream vLLM
# source verbatim with its alignment and line numbers, so reformatting them
# would misquote it.
extend-exclude = ["docs/plan", "*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # Pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "ISC",  # flake8-implicit-str-concat
    "SIM",  # flake8-simplify
    "I",    # isort
    "G",    # flake8-logging-format
    "INP",  # flake8-no-pep420
    # Project addition: pydocstyle with the Google convention. The user must be
    # able to explain every public function, so the package requires docstrings
    # (vLLM does not lint this; its review does).
    "D",
]
ignore = [
    # Same ignores as vLLM.
    "F405", "F403", "E731", "B905", "B007", "UP032",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Only the installed package needs __init__.py files and docstrings; tests,
# tools, benchmarks and setup.py are standalone scripts (as in vLLM: INP off
# outside the package). Tests document themselves through their teaching
# docstrings, which review checks; D's formatting rules would only add noise.
"!python/**" = ["INP", "D"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy: vLLM's settings minus the pydantic plugin (no pydantic here).
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "silent"
files = ["python/pth_flash_attn", "python/pth_testing", "tools"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests/cpu", "tests/sim"]
# Each test file imports `pth_flash_attn` and the test oracles `pth_testing`
# from python/ without installation.
pythonpath = ["python"]
timeout = 600
markers = [
    "slow: minutes-long CPU tests (e.g. Triton-interpreter writer equivalence)",
    "full: larger CPU matrices",
    "gpu: needs a CUDA device; only run in a scheduled GPU session",
    "attn: tests of the tensor-core kernel library (build/attn/libpth_attn.so)",
    "backend: vLLM backend, plugin and production-op tests",
]

# ---------------------------------------------------------------------------
# typos (spell checker; vLLM runs it in pre-commit)
# ---------------------------------------------------------------------------
[tool.typos.files]
# Agent logs (docs/handoff, docs/history) quote commit hashes and build ids
# verbatim; they are records, not prose to spell-check.
extend-exclude = ["docs/plan/*", "docs/handoff/*", "docs/history/*", "build/*", ".git/*", "results/*"]
ignore-hidden = false

[tool.typos.default]
# Commit hashes quoted as code (`2ba629eed1`) in docs/upstream and elsewhere.
extend-ignore-re = ["`[0-9a-f]{7,40}`"]

[tool.typos.default.extend-identifiers]
# CUDA runtime API names (opt-in shared memory per block), used in bench/;
# listed as whole identifiers, as vLLM does, so "optin" stays a typo elsewhere.
cudaDevAttrMaxSharedMemoryPerBlockOptin = "cudaDevAttrMaxSharedMemoryPerBlockOptin"
sharedMemPerBlockOptin = "sharedMemPerBlockOptin"

[tool.typos.default.extend-words]
# Genuine domain words that typos would flag go here, one per line, each with
# a comment saying where it occurs.
# Compute sub-tile (ADR 0012, docs/adr/0012-tiles-stages-subtiles.md); vLLM
# allows "subtile" the same way.
subtile = "subtile"
subtiles = "subtiles"
