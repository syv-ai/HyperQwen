[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperqwen-lsa"
version = "0.1.0"
description = "D-LSA (Latent Sparse Attention, flat design) for vLLM's Triton attention backend"
requires-python = ">=3.10"
dependencies = ["vllm>=0.32.0"]
license = {file = "LICENSE"}

[project.entry-points."vllm.general_plugins"]
hyperqwen_lsa = "hyperqwen_lsa:register"

[tool.setuptools]
packages = ["hyperqwen_lsa"]

[tool.setuptools.package-dir]
"" = "python"
